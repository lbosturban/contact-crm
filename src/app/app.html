<a class="skip-link" href="#main">{{ 'app.title' | t }}</a>

<div class="app-shell">
  <header class="app-header">
    <a routerLink="/" class="brand">
      <span class="brand-mark" aria-hidden="true">C</span>
      <span class="brand-text">
        <strong>{{ 'app.title' | t }}</strong>
        <small>{{ 'app.tagline' | t }}</small>
      </span>
    </a>

    <nav class="main-nav" aria-label="Main navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        {{ 'nav.dashboard' | t }}
      </a>
      <a routerLink="/contacts" routerLinkActive="active">{{ 'nav.contacts' | t }}</a>
      <a routerLink="/categories" routerLinkActive="active">{{ 'nav.categories' | t }}</a>
      <a routerLink="/favorites" routerLinkActive="active">{{ 'nav.favorites' | t }}</a>
      <a routerLink="/contacts/new" class="nav-cta">+ {{ 'nav.newContact' | t }}</a>
      <a routerLink="/categories/new" class="nav-cta">+ {{ 'categories.new' | t }}</a>
    </nav>

    <div class="header-tools">
      <button
        type="button"
        class="icon-btn lang-btn"
        (click)="i18n.toggleLanguage()"
        [attr.aria-label]="'lang.switch' | t"
        [title]="'lang.switch' | t"
      >
        @if (i18n.language() === 'fr') {
          <span>🇫🇷 FR</span>
        } @else {
          <span>🇬🇧 EN</span>
        }
      </button>
      <button
        type="button"
        class="icon-btn"
        (click)="themeService.toggle()"
        [attr.aria-label]="'theme.toggle' | t"
        [title]="'theme.toggle' | t"
      >
        {{ themeService.theme() === 'light' ? '☾' : '☀' }}
      </button>
    </div>
  </header>

  <main id="main" class="app-main" tabindex="-1">
    <router-outlet />
  </main>

  <footer class="app-footer">
    <p>{{ 'footer.madeWith' | t }}</p>
  </footer>
</div>
